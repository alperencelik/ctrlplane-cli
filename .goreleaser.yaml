# Release: push a tag vX.Y.Z. GoReleaser builds ctrlplane for Linux, macOS and Windows and
# attaches the archives and checksums to the GitHub Release.
version: 2
builds:
  - main: ./cmd/ctrlplane
    binary: ctrlplane
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
